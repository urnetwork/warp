name: Test — warp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# connect/test.yml and sdk/test.yml (the two oldest) set neither concurrency
# nor timeout-minutes, so a busy branch stacks runs there and a hung job sits
# on GitHub's 6h default. server/test.yml and linux/build.yml (the two newest)
# set both. This follows the newer habit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    # The job is about 4 minutes. Bounded on purpose: GitHub's default is 6h.
    timeout-minutes: 20
    steps:
      - name: Check out warp
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # warp requires no urnetwork module and carries no `replace ../`
      # directives, so unlike sdk/connect/server/proxy this needs no sibling
      # checkouts. A lone checkout builds.
      - name: Build
        run: go build ./...

      # The service Makefiles ship more than the runner's own platform:
      # warpctl, lb and config-updater each build linux/{amd64,arm64} and
      # darwin/{amd64,arm64}, grafana both linux arches. The native amd64 build
      # above never compiles supervise_darwin.go at all, so a darwin break
      # stays invisible until someone runs warpctl on a mac. Compile-only --
      # no -o, nothing is kept, nothing is published.
      - name: Cross-compile the other shipped platforms
        run: |
          for target in linux/arm64 darwin/amd64 darwin/arm64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

      # -count=1 defeats the test result cache so a green run always means the
      # tests actually ran. The rest of the suite is hermetic and takes ~25s
      # with the race detector on.
      #
      # -race because the repo's own test.sh runs with it, and because this is
      # a process supervisor: goroutines, signal handling and health-check
      # timers are most of what supervise_test.go and the warpctl tests cover.
      # Verified stable, including on an oversubscribed 2-core box, so the
      # timing-sensitive supervisor tests do not flake under instrumentation.
      #
      # Two nginx tests skip themselves here rather than run, and say so:
      # warpctl/config_test.go:420 and lb/nginx_proxy_protocol_test.go:51 both
      # look for the pinned NGINX 1.31.4 from `make nginx_local` in warp/lb and
      # skip when it is absent. Building it is not worth it yet -- see the note
      # on the next step, which is the same story.
      #
      # The one test wanting AWS credentials is parked as XTestClient
      # (warpctl/dynamo/client_test.go), which `go test` never collects. No
      # secret is referenced anywhere in this workflow.
      - name: Test
        run: go test -count=1 -race -timeout 20m -skip 'TestNginxLogsOmitClientAddr' ./...

      # TestNginxLogsOmitClientAddr fails on a fresh checkout on ubuntu-latest,
      # before any change of ours, and it is not flaky.
      #
      # Its guard is weaker than its two siblings'. They check for the pinned
      # binary and its version; this one only checks exec.LookPath("nginx")
      # (nginx_test.go:236) and assumes whatever it finds can do `stream`. The
      # ubuntu-latest image ships nginx, so the test does NOT skip -- and the
      # Ubuntu package builds stream as a DYNAMIC module, while the standalone
      # nginx.conf the test writes has no load_module line. So nginx refuses to
      # start: `unknown directive "stream"`, and the test times out waiting for
      # a listener that will never come up.
      #
      # Building the repo's own pinned nginx does not rescue it: `make
      # nginx_local` configures --without-http_rewrite_module, and the test's
      # config uses `return`, so that binary fails it too ("return" directive is
      # not allowed here). The same build also lacks --with-http_ssl_module,
      # which turns warpctl's TestNginxConfigValidation from a clean skip into a
      # failure on `ssl_protocols`. Installing an nginx currently makes warp's
      # CI worse, not better, which is why this job does not.
      #
      # So it is reported but not allowed to gate. The fix belongs in the repo:
      # give this test the same guard as its siblings (require the pinned
      # binary, or check `nginx -V` for --with-stream before running), and widen
      # `make nginx_local` to cover what these tests actually use -- stream,
      # rewrite and http_ssl. Remove this step once that lands.
      - name: Test nginx log scrubbing (needs a capable nginx, non-blocking)
        continue-on-error: true
        run: go test -count=1 -timeout 5m -run 'TestNginxLogsOmitClientAddr' .

      # `go vet ./...` also fails on a fresh checkout of main, before any change
      # of ours, and for a reason unrelated to nginx:
      # warpctl/cloudwatchlogs/client.go:98 is a `return nil` sitting after a
      # `for { select { ... } }` that has no break, so it is unreachable.
      #
      # It is one dead line and no other package has a finding, but vet reports
      # a dependency's diagnostic against every package that imports it, so
      # warpctl cannot be vetted around it -- filtering it out the way
      # connect/test.yml filters its extender package would drop the largest
      # package in the repo out of vet entirely. Reported, not gating.
      #
      # Delete that one line and this step can lose continue-on-error and
      # become a real gate.
      - name: Vet (known pre-existing failure, non-blocking)
        continue-on-error: true
        run: go vet ./...

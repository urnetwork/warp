name: Test — warp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Check out warp
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # warp requires no urnetwork module and carries no `replace ../`
      # directives, so unlike sdk/connect/server/proxy this needs no sibling
      # checkouts. A lone checkout builds.
      - name: Build
        run: go build ./...

      # -count=1 defeats the test result cache so a green run always means the
      # tests actually ran. The rest of the suite is hermetic and takes ~15s.
      #
      # Two nginx tests skip themselves here rather than run, and say so:
      # warpctl/config_test.go:420 and lb/nginx_proxy_protocol_test.go:51 both
      # look for the pinned NGINX 1.31.4 from `make nginx_local` in warp/lb and
      # skip when it is absent. Building it is not worth it yet -- see the note
      # on the next step, which is the same story.
      #
      # The one test wanting AWS credentials is parked as XTestClient
      # (warpctl/dynamo/client_test.go), which `go test` never collects. No
      # secret is referenced anywhere in this workflow.
      - name: Test
        run: go test -count=1 -timeout 20m -skip 'TestNginxLogsOmitClientAddr' ./...

      # TestNginxLogsOmitClientAddr fails on a fresh checkout on ubuntu-latest,
      # before any change of ours, and it is not flaky.
      #
      # Its guard is weaker than its two siblings'. They check for the pinned
      # binary and its version; this one only checks exec.LookPath("nginx")
      # (nginx_test.go:236) and assumes whatever it finds can do `stream`. The
      # ubuntu-latest image ships nginx, so the test does NOT skip -- and the
      # Ubuntu package builds stream as a DYNAMIC module, while the standalone
      # nginx.conf the test writes has no load_module line. So nginx refuses to
      # start: `unknown directive "stream"`, and the test times out waiting for
      # a listener that will never come up.
      #
      # Building the repo's own pinned nginx does not rescue it: `make
      # nginx_local` configures --without-http_rewrite_module, and the test's
      # config uses `return`, so that binary fails it too ("return" directive is
      # not allowed here). The same build also lacks --with-http_ssl_module,
      # which turns warpctl's TestNginxConfigValidation from a clean skip into a
      # failure on `ssl_protocols`. Installing an nginx currently makes warp's
      # CI worse, not better, which is why this job does not.
      #
      # So it is reported but not allowed to gate. The fix belongs in the repo:
      # give this test the same guard as its siblings (require the pinned
      # binary, or check `nginx -V` for --with-stream before running), and widen
      # `make nginx_local` to cover what these tests actually use -- stream,
      # rewrite and http_ssl. Remove this step once that lands.
      - name: Test nginx log scrubbing (needs a capable nginx, non-blocking)
        continue-on-error: true
        run: go test -count=1 -timeout 5m -run 'TestNginxLogsOmitClientAddr' .

# api (DESIGN §19.4's api row, W8): api keeps its own mounts, the whole vault among them, as the oauth issuer is the
# one block that holds signing keys (D-OPS-1). It adds the first metadata cluster through its own MinIO user
# (file-clusters-api.yml, which reaches only proj/, projrows/, rev/ and hold/), named here so the mount follows the
# block wherever its vault mount goes, and it serves sidecar routes, so its access log keeps paths and never query
# strings (W8; log_uri). The page Worker at the key origin, https://sidecar.ur.io, calls api across origins (§18.8,
# §18.9; OPS-M4-01), auth.bringyour.com's token exchange among its routes, since the lb routes that name to api, so the
# origin joins api's cors_origins; a service that takes api's list by cors_origins_from takes it too. The page at
# https://ur.io holds no token and calls nothing here.
#
# From M5 api also mounts monitor.yml, the monitor's own vault file, whose alerts.pager_webhook_url it reads at start
# to page §21.8's registrar, registry and law-enforcement notices itself (server's controller.InstallAbuseNoticePager;
# QD-1070, owner decision 612): the staff route's file_notice and the platform listener's role-mail notice route both
# commit a case here, and its page leaves this process under the case's key. Named here, as file-clusters-api.yml is,
# so the mount follows the block wherever its vault mount goes, and warp refuses to start api while the file is
# missing. sidecar-blocks/README.md says how a fragment reaches services.yml.
#
# The internal gate (§8.9, §19.4; owner decision 340, QD-055, QD-680): api's /internal/gate/ is the read surface the
# blocks with no database reach on their own bearers, at https://api.<domain>, the url each block's fragment gives it
# as UR_API_URL. The lb answers 403 under that prefix, on every name it serves api by and on its lb hosts' /by/
# routes, to every source outside internal_routes' allow_subnets, the site's own ranges (W8's allow list, QD-027):
# the addresses the site's hosts reach the lb from, their LAN and docker networks and the gateways' blocks, which
# each lb interface's rate_limit exclude_subnets must cover too, as for the edges' own Finds. Each is a production
# range no fragment holds: a fill-in- placeholder the owner replaces with as many cidr blocks as the site needs
# (README.md).
#
# gkm's url (§14.8, §19.4's api row; plan-SMTP-report-seal-key, QD-075, QD-1140): from M5 the gate's
# /internal/gate/report-key/<network_id> answers the platform listener's report intake the key it seals a network's
# reports to, which api reads from gkm's drop-key route under a deposit token it mints itself (server's
# controller.SmtpReportKeySource). api takes no flag for it, so its projection reads the url from its environment
# itself: UR_GKM_URL (server's sidecarhost.GkmUrlEnvName), https://gkm.${WARP_DOMAIN}, the name gkm.yml gives gkm,
# which warpctl writes out with the env's own domain as it does every block's service urls (README.md). Without it
# api's source has no gkm and answers none for every network, said once at start, so each report's raw bytes are
# dropped unread and its fields kept. api reaches gkm through the lb from the site's ranges, which each lb
# interface's rate_limit exclude_subnets must cover (README.md), so its reads stay out of gkm's per-address limit
# (W2) as the blocks' gate calls stay out of api's. alt.yml gives alt, which runs the same installs, the same url.
version:
    services:
        api:
            cors_origins:
                - https://sidecar.ur.io
            internal_routes:
                prefixes:
                    - /internal/gate/
                allow_subnets:
                    - fill-in-site-ipv4-range
                    - fill-in-site-ipv6-range
            env_vars:
                UR_GKM_URL: "https://gkm.${WARP_DOMAIN}"
            secret_files:
                - file-clusters-api.yml
                - monitor.yml
            log_uri: true

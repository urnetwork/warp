# dns, the API role (§12.6, §12.8; DESIGN §19.4's dns row, D-OPS-1, W8; OPS-M5-03): server/cli/dns with
# --role api on dns.bringyour.com, §12.8's routes and the edges' journal feed. It holds Postgres (dns_*, MG2 and
# MG5) and Redis ({dns}), so it mounts pg.yml and redis.yml, with db.yml's pool of 4 (§19.7). Its other secrets
# are its audience's public JWKS for sidecars' service tokens, the SHA-256 of each internal caller's bearer, the
# dns edges' and the monitors' (internal-verify.yml, plan-DNS-internal-route-credential), vault's services.yml,
# whose lb inventory every feed answer names (DNS's reading 6), the DNSKEY windows the key ceremony pre-signed for
# each root dns.yml lists, one file a root (dns-key-windows-<root>.json; main's root is ur.network), and its
# read-only projection credential (internal-gate-dns.yml) and its push-only metrics credential (QD-249). Never the ZSK, which only the dns edges mount (§12.6).
#
# Its internal routes, under /dns/internal/, take their callers' bearers: the dns edges', which reach them at
# https://dns.<domain>, the url dnsedge.yml gives each edge as UR_API_URL, the monitors', certs' in taskworker and
# lbmap's in the lb. The lb answers 403 under that prefix, on every name it serves dns by and on its lb hosts' /by/
# routes, to every source outside internal_routes' allow_subnets (W8; QD-027): the site's ranges, the addresses the
# site's hosts reach the lb from, as api.yml lists them, and the off-site monitor host's address. Each is a
# production value no fragment holds: a fill-in- placeholder the owner replaces with as many cidr blocks as it needs,
# the monitor's a /32 or /128 (README.md).
# sidecar-blocks/README.md says how a fragment reaches services.yml.
version:
    services:
        dns:
            expose_aliases:
                - dns.bringyour.com
            internal_routes:
                prefixes:
                    - /dns/internal/
                allow_subnets:
                    - fill-in-site-ipv4-range
                    - fill-in-site-ipv6-range
                    - fill-in-monitor-outside-address
            mount:
                vault: no
                config: yes
                site: no
            user: "65532:65532"
            env_vars:
                WARP_VAULT_HOME: /srv/warp/secrets
                UR_API_URL: https://api.${WARP_DOMAIN}
            secret_files:
                - dns-key-windows-ur.network.json
                - grafana-push-dns.yml
                - internal-gate-dns.yml
                - internal-verify.yml
                - oauth-jwks-svc.json
                - pg.yml
                - redis.yml
                - services.yml
            log_uri: true
            ports:
                - 80
            blocks:
                - beta: 1
                - g1: 99

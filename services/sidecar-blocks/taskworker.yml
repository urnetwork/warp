# taskworker (DESIGN §19.4's taskworker row): taskworker keeps its own mounts, the whole vault among them, and adds
# every file cluster through its own MinIO user (file-clusters-taskworker.yml), the segment bucket's DELETE included,
# for GC, evacuation, packing, shreds, gkm's reconciler, the write budget's and HDD loops and rev/ deletion. It
# serves no sidecar route, so its log is as it was. sidecar-blocks/README.md says how a fragment reaches
# services.yml.
#
# From M8 it also holds the push sender's APNs and FCM keys (§19.4's push sender, D-OPS-1), in wake-vendors.yml, the
# file server/taskworker/wake_sender.go reads: under apns, endpoint, topic, team_id, key_id and the .p8 key in PEM as
# private_key; under fcm, endpoint and the project's service account JSON as service_account. Either may be absent,
# and a file naming neither starts no sender. The keys are the owner's to create in vault, before this fragment is
# applied, since warp refuses to start a block whose scoped secret is missing.
#
# From M9 it also holds the mail breakers' credentials for their outside measures (§21.5, §21.16; owner decision
# 611): abuse-postmaster-tools.yml, the Google service account's client_id, client_secret and refresh_token for
# Postmaster Tools' read-only API, and abuse-snds.yml, SNDS's automated data access key as key, the files
# server/mail_measures_postmaster.go and server/mail_measures_snds.go read. taskworker builds the two sources at start
# (work.InstallMailBreakerSources); a file that holds no usable credential leaves its measure unknown, which holds the
# breakers. The accounts and both files are the owner's (§23.7), in vault before this fragment is applied, as above.
# It names no copy of the listing feed's mirror (taskworker's --feed_dir): no pull sets one up on any host yet, and
# mxedge's router names none either, so the breakers' listing stays unknown until the feed's pull lands.
#
# From M5 it also mounts monitor.yml, the monitor's own vault file, whose alerts.pager_webhook_url it reads at start
# for §21.8's notices (server's controller.InstallAbuseNoticePager; QD-1070, owner decision 612): its clock pass pages
# again each minute every open notice whose page a crash, or a process with no pager, left owed, under the case's key.
# The file is the monitor's and already in the vault.
#
# From M12 it also holds the compute provider adapters' credentials (DESIGN-COMPUTE §4.6, §14.5; CSRV-M12-05),
# compute-providers.yml, the file CSRV-M12-03 named for the compute block, which compute's jobs here read through their
# adapters: compute_provider_prices' hourly price reads, compute_canary's calls and compute_direct_settle's usage
# lookups (sidecar/work, server/taskworker/compute_jobs.go). The jobs' areas read it only when they ask, and a job whose
# area has not landed reads nothing. The file is the owner's to create in vault before this fragment is applied, as
# above. K_P's signer key stays on the compute block alone (compute-gamma-signer.yml, §10.5), and GAMMA's chain
# endpoints and trading keys join here when GAMMA's jobs name their file.
version:
    services:
        taskworker:
            secret_files:
                - abuse-postmaster-tools.yml
                - abuse-snds.yml
                - compute-providers.yml
                - file-clusters-taskworker.yml
                - monitor.yml
                - wake-vendors.yml

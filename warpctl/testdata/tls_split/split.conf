user www-data;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
# without this the main level keeps the package default
# (/var/log/nginx/error.log), which the stream block inherits -- so
# stream errors, which carry the client address, would be written to
# a file inside the container instead of passing through the lb
# process where the address is scrubbed
error_log stderr;
# target concurrent users (from services.yml): 786432
# https://www.nginx.com/blog/tuning-nginx/
worker_processes 24;
worker_shutdown_timeout 60m;
worker_rlimit_nofile 1048576;
events {
    worker_connections 524288;
    multi_accept on;
    accept_mutex on;
    use epoll;
}
http {
             ##
             # Basic Settings
             ##

             sendfile on;
             # minimize latency
             tcp_nodelay on;
             tcp_nopush off;
             types_hash_max_size 2048;
             server_tokens off;

             include /etc/nginx/mime.types;
             default_type application/octet-stream;

             ##
             # SSL Settings
             ##
             # see https://syslink.pl/cipherlist/

             ssl_protocols TLSv1.2 TLSv1.3;
             ssl_prefer_server_ciphers on;
             ssl_dhparam /etc/nginx/dhparam.pem; # openssl dhparam -out /etc/nginx/dhparam.pem 4096
             ssl_ciphers EECDH+AESGCM:EDH+AESGCM;
             ssl_ecdh_curve X25519:prime256v1:secp384r1; # Requires nginx >= 1.11.0 for a list
             ssl_session_timeout  10m;
             ssl_session_cache shared:SSL:10m;
             ssl_session_tickets off; # Requires nginx >= 1.5.9
             resolver 1.1.1.1 1.0.0.1 valid=300s;
             resolver_timeout 5s;

             ##
             # Logging Settings
             ##

             # the client ip is deliberately absent. nginx's built-in "combined"
             # format leads with $remote_addr, so the default access_log wrote the
             # address of every user through the lb. $connection and
             # $connection_requests keep requests that shared a connection
             # correlatable without identifying who made them.
             # note $http_x_forwarded_for and $http_referer are also omitted --
             # both can carry a client address forwarded from elsewhere.
             log_format noclientaddr '$time_iso8601 $connection $connection_requests '
                                     '$host "$request" $status $body_bytes_sent $request_time '
                                     '$upstream_addr $upstream_status $upstream_response_time '
                                     '"$http_user_agent"';
             access_log /dev/stdout noclientaddr;
             # nginx appends ", client: <addr>" to request-scoped error entries
             # itself and there is no log_format for the error log, so the
             # address here can only be removed downstream of nginx.
             error_log stderr;

             ##
             # Gzip Settings
             ##

             gzip on;

             ##
             # Http Settings
             ##

             http2 on;
             http3 on;
             quic_retry on;
             quic_gso on;
             # see https://blog.trailofbits.com/2019/03/25/what-application-developers-need-to-know-about-tls-early-data-0rtt/
             ssl_early_data off;

             keepalive_timeout 1m;
             client_header_buffer_size 4k;
             large_client_header_buffers 8 8k; 
             client_body_buffer_size 64k;
             client_max_body_size 16m;
             proxy_buffering off;
             proxy_request_buffering on;
             client_header_timeout 15s;
             client_body_timeout 15s;
             proxy_http_version 1.1;
             proxy_socket_keepalive on;
             # retry classes are deliberately narrow (APIDRAIN1.md server repo §2.4):
             # error and timeout ride over a draining or flipping upstream: its
             # closed listener, or a keepalive connection cut at shutdown, is
             # error (a draining api answers neither 502 nor 503). An upstream's
             # own 500, 502 or 504 is an application answer, and with
             # non_idempotent a retry would re-execute the POST on a sibling: the
             # api answers 502 when a dependency refused the work, and on
             # 2026-10-19 one password reset made two codes and two SMS sends.
             # http_503 is kept as §2.4 left it
             proxy_next_upstream error timeout http_503 non_idempotent;
             proxy_next_upstream_tries 2;
             proxy_connect_timeout 30s;
             proxy_read_timeout 30s;
             proxy_send_timeout 30s;
    send_timeout 30s;

             # Exact status-map keys include the private route prefix, service,
             # and block names. Production's longest current key does not fit
             # nginx's platform-selected default bucket, which makes
             # nginx reject the entire generated configuration before binding
             # any listener. Keep one explicit cache-line-aligned bucket large
             # enough for those generated keys.
             map_hash_bucket_size 128;

             
    # the tls split (W1): the http servers' 443 is a unix socket that only the
    # split's stream server reaches, so restore the visitor from its PROXY header
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;
    # lbmap's custom names on port 80 run to 253 bytes (TLS-M6-01)
    server_names_hash_bucket_size 512;
    map $remote_addr $warp_client_addr {
        default $remote_addr;
        "~:" "[$remote_addr]";
    }
    geo $limit_key_exclude {
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    198.51.100.0/24 1;
    2001:db8:1234::/48 1;
        default 0;
    }
      map $host $limit_status_host {
    default 0;
      
    test-lb.example.com 1;
          

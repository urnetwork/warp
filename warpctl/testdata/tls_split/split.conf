    /by/b/tlsedge/g1/status 1;
          
    /by/service/svc-a/status 1;
          
    /by/service/svc-b/status 1;
          
    /by/service/svc-c/status 1;
          
    /by/service/svc-d/status 1;
          
    /by/service/taskworker/status 1;
          
    /by/service/tlsedge/status 1;
          
    /status 1;
          

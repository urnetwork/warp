        server testservices:7045 weight=25 max_fails=0 max_conns=32768;
        server testservices:7046 weight=25 max_fails=0 max_conns=32768;
        server testservices:7047 weight=25 max_fails=0 max_conns=32768;
    }
    upstream stream-service-block-tlsedge-443 {
        least_conn;
        server testservices:7105 weight=1 max_fails=0 max_conns=32768;
        server testservices:7108 weight=99 max_fails=0 max_conns=32768;
    }
    upstream stream-service-block-tlsedge-8443 {
        least_conn;
        server testservices:7106 weight=1 max_fails=0 max_conns=32768;
        server testservices:7109 weight=99 max_fails=0 max_conns=32768;
    }
    # the tls split (W1): names under a root, other than the root and the
    # platform names the http servers serve there, go unterminated to the tls
    # edge; everything else, and a hello without sni, to the http servers.
    # lbmap reads what it guards from the next line (TLS-M6-01)
    # warp-lbmap: {"format":1,"roots":["root.example"],"platform_domains":["api.root.example","example.com","root.example","test-lb.example.com","test-svc-a.example.com","test-svc-b.example.com","test-svc-c.example.com","test-svc-d.example.com","test-tlsedge.example.com"],"edge_upstream":"stream-service-block-tlsedge-443"}
    map_hash_bucket_size 512;
    map $ssl_preread_server_name $tls_split_upstream {
        hostnames;
        root.example lb-https;
        api.root.example lb-https;
        *.root.example stream-service-block-tlsedge-443;
        include /run/warp-lb/tls-custom-hosts.map;
        default lb-https;
    }
    upstream lb-https {
        server unix:/run/warp-lb/https.sock;
    }
    server {
        listen 443 reuseport backlog=65535;
        listen [::]:443 reuseport backlog=65535;
        ssl_preread on;
        # tlsedge.yml's client_hello: the lb never passes a hello the edge refuses
        preread_timeout 10s;
        preread_buffer_size 16384;
        proxy_protocol on;
        proxy_pass $tls_split_upstream;
        proxy_buffer_size 32768;
    }
    server {
        listen 444;
        listen [::]:444;
        proxy_protocol on;
        proxy_pass stream-service-block-svc-c-444;
    }
    server {
        listen 1080;
        listen [::]:1080;
        proxy_protocol on;
        proxy_pass stream-service-block-svc-c-1080;
    }
    server {
        listen 5353;
        listen [::]:5353;
        proxy_protocol on;
        proxy_pass stream-service-block-svc-c-5353;
    }
    server {
        # UDP upstreams require the binary address family
        # and port fields carried by PROXY protocol v2.
        # Keep the UDP pseudo-session shorter than the
        # connect server's PP address-state lifetime.
        listen 443 udp reuseport;
        listen [::]:443 udp reuseport;
        proxy_protocol v2;
        proxy_timeout 30s;
        # QUIC exchanges an unbounded number of datagrams
        # in both directions during one pseudo-session.
        proxy_requests 0;
        proxy_pass stream-service-block-svc-c-443;
    }
    server {
        # UDP upstreams require the binary address family
        # and port fields carried by PROXY protocol v2.
        # Keep the UDP pseudo-session shorter than the
        # connect server's PP address-state lifetime.
        listen 5353 udp reuseport;
        listen [::]:5353 udp reuseport;
        proxy_protocol v2;
        proxy_timeout 30s;
        # QUIC exchanges an unbounded number of datagrams
        # in both directions during one pseudo-session.
        proxy_requests 0;
        proxy_pass stream-service-block-svc-c-5353;
    }
    server {
        listen 8443;
        listen [::]:8443;
        proxy_protocol on;
        proxy_pass stream-service-block-tlsedge-8443;
    }
}
# A slice of config/<env>/settings.yml: per host settings (anchored, with the
# lan routes) and the lan_hosts block the lan router r-us-tst-5-1 renders.
edge-3.example.com: &tst
    env_vars: &tst_env
        BRINGYOUR_POSTGRES_HOSTNAME: 192.168.51.43
    routes:
        edge-2: 192.168.51.43
        edge-3: 192.168.51.180
        edge-6: 192.168.51.193
        fern: 192.168.51.196
        spruce: 172.28.208.185
    latitude: 0.000000
edge-5.example.com: *tst
fern.example.com: *tst
sequoia:
    <<: *tst
    env_vars:
        <<: *tst_env
        BRINGYOUR_POSTGRES_HOSTNAME: 172.28.208.182

lan_hosts:
    birch:
        ip: 192.168.51.176
        mac: 00:00:5e:00:53:18
    edge-2:
        ip: 192.168.51.43
        mac: 00:00:5e:00:53:1c
    edge-3:
        ip: 192.168.51.180
        mac: 00:00:5e:00:53:16
    edge-6:
        ip: 192.168.51.193
        mac: 00:00:5e:00:53:15
    fern:
        ip: 192.168.51.196
        mac: 00:00:5e:00:53:12

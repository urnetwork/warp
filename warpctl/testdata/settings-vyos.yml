# A slice of config/<env>/settings.yml: per host settings (anchored, with the
# lan routes) and the lan_hosts block the lan router r-us-tst-5-1 renders.
edge-3.example.com: &tst
    env_vars: &tst_env
        BRINGYOUR_POSTGRES_HOSTNAME: 192.168.51.43
    routes:
        edge-2: 192.168.51.43
        edge-3: 192.168.51.180
        edge-6: 192.168.51.193
        fireside: 192.168.51.196
        snow: 172.28.208.185
    latitude: 37.548271
edge-5.example.com: *tst
fireside.example.com: *tst
sille:
    <<: *tst
    env_vars:
        <<: *tst_env
        BRINGYOUR_POSTGRES_HOSTNAME: 172.28.208.182


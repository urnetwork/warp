          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'time() - max(urnetwork_backup_archive_latest_timestamp_seconds{env="main",host="planetoid",archive="redis"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [432000], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels: {service: backup-archive, severity: page, archive: redis}
        annotations:
          summary: Planetoid has no Redis archive newer than five days.
        isPaused: false


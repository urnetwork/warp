# SN25 validator rules on the gauges sn-validator-health.timer publishes from
# snow (xops main/ansible/playbook-validator-health.yml; the gauge table is in
# xops main/ansible/SN-MAINNET-VALIDATOR.md, "Health metrics"). Fluent Bit
# ships them with env=main and host=snow. Their job label was sn-validator,
# from a second node_exporter_metrics input in snow's Fluent Bit, until snow's
# one input took them over with job node, so no rule here selects a job.
#
# Telemetry, progress, unit and weight rules alert on missing data. Rules on
# gauges that are absent by design while a source is not current resolve on
# missing data instead, because the progress and stale rules cover that.
apiVersion: 1
groups:
  - orgId: 1
    name: sn-validator
    folder: urnetwork alerts
    interval: 1m
    rules:
      # The timer, its unit, Fluent Bit or the push to Mimir stopped. Missing data alerts too.
      - uid: sn-validator-health-stale
        title: SnValidatorHealthStale
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'time() - max(urnetwork_sn_validator_sample_timestamp_seconds{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [180], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "Snow has published no validator health sample for over three minutes; every other SN25 validator alert is blind."
        isPaused: false

      # The validator process has stopped publishing, which is how a dead or wedged process looks.
      - uid: sn-validator-progress-down
        title: SnValidatorProgressDown
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'min(urnetwork_sn_validator_progress_ok{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "The SN25 validator's progress file is missing, invalid or more than two minutes old."
        isPaused: false

      # One panic restart takes about 30 seconds and does not reach this hold.
      - uid: sn-validator-unit-inactive
        title: SnValidatorUnitInactive
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'min(urnetwork_sn_validator_unit_active{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 3m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "sn-validator.service on snow has not been active and running for three minutes."
        isPaused: false

      # Counts automatic restarts only. A deploy resets the counter and is not a restart here.
      - uid: sn-validator-restarted
        title: SnValidatorRestarted
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(delta(urnetwork_sn_validator_unit_restarts{env="main",host="snow"}[30m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "systemd restarted the SN25 validator in the last 30 minutes; ten steering hard errors in a row end in a panic."
        isPaused: false

      # Absent while the validator's native or intent observation is not current; the progress rule covers that.
      - uid: sn-validator-intent-late
        title: SnValidatorIntentLate
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_intent_missing_blocks{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [100], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 2m
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "The SN25 validator has not begun this native epoch's intent 100 blocks (20 minutes) in; it normally does by about 80."
        isPaused: false

      # The epoch is 361 blocks, so about 40 minutes remain to act.
      - uid: sn-validator-intent-missing
        title: SnValidatorIntentMissing
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_intent_missing_blocks{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [150], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "The SN25 validator has not begun this native epoch's intent 150 blocks (30 minutes) in. A missed epoch strands it: restart it once now (SN-MAINNET-VALIDATOR.md)."
        isPaused: false

      # A lag of 1 is normal until the new epoch's intent begins; 2 or more is a missed epoch.
      - uid: sn-validator-epoch-missed
        title: SnValidatorEpochMissed
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_intent_epoch_lag{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [1], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "The SN25 validator missed a native epoch. It records its own gap edge, restarts once and resumes, unless it refuses the edge and holds for a person (its hold line names why)."
        isPaused: false

      # Each steering read replays the whole retained intent history, so passes slow as it grows.
      - uid: sn-validator-steering-slow
        title: SnValidatorSteeringSlow
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_steering_cycle_max_seconds{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [45], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "SN25 validator steering passes take over 45 seconds; each read attempt has 60."
        isPaused: false

      # Read waits retry; hard errors count toward the ten-in-a-row panic.
      - uid: sn-validator-steering-failing
        title: SnValidatorSteeringFailing
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_steering_hard_errors_recent{env="main",host="snow"} + urnetwork_sn_validator_steering_read_waits_recent{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [3], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "The SN25 validator logged more than three steering hard errors and read waits in 15 minutes."
        isPaused: false

      # A stuck read logs one read wait every 5 minutes, which never trips the
      # rule above (11-03, from 04:04Z: the read after 26109's finalize timed
      # out at 290 s again and again, with no alert). Count instead from the
      # later of the last steering success and 15 minutes after the process
      # started. Success is complete, working, reveal_wait and receipt_pending
      # without a cause (sn validator/production_steering_loop.go), so the
      # ~2.7 s reads every 3 s of an intent waiting to apply keep it at zero.
      # An operation runs 13 to 25 minutes without one, and startup about 15.
      # A native gap hold, read waits and hard errors never succeed. It pages,
      # because only a person can restart or bridge, and an epoch lasts 72 minutes.
      - uid: sn-validator-steering-stuck
        title: SnValidatorSteeringStuck
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'time() - max((urnetwork_sn_validator_steering_last_success_timestamp_seconds{env="main",host="snow"} > (urnetwork_sn_validator_process_start_timestamp_seconds{env="main",host="snow"} + 900)) or (urnetwork_sn_validator_process_start_timestamp_seconds{env="main",host="snow"} + 900))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [1800], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 2m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "The SN25 validator's steering has not succeeded for 30 minutes (45 after a start): a stuck read, a native gap hold or a stalled operation. Read its journal; a restart clears a stuck read."
        isPaused: false

      # The automatic native gap edge records itself, then restarts the
      # validator once to admit it (sn validator/release_native_gap_edges_v2.go).
      # The steering missed at least one native epoch first; find out why.
      - uid: sn-validator-native-gap-edge
        title: SnValidatorNativeGapEdgeRecorded
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_native_gap_edges_recorded_recent{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "The SN25 validator missed a native epoch and recorded its own gap edge, then restarted once to resume. Find out why it missed the epoch."
        isPaused: false

      # UID 1's weight age is the younger of two commit ages (runtime 490
      # moves LastUpdate at the commit). The fallback logs its chain read only
      # while its timer runs, so the other is the time since the validator's
      # newest finalized commit block first appeared, at 12 seconds a block.
      # Reading the fallback alone, its stopped timer paged on missing data
      # from 11-11 06:03Z for three days while the validator committed every
      # epoch. The fallback submits at 760 and reads every 10 minutes, so its
      # reading peaks near 810 before its own commit lands; 860 is one more
      # reading. A fallback commit shows only in that reading, which ends 30
      # minutes after its timer stops. Missing data means no fallback reading
      # in 30 minutes and no finalized commit in four hours.
      - uid: sn-validator-weights-stale
        title: SnValidatorWeightsStale
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'min(label_replace(max(urnetwork_sn_validator_weights_age_blocks{env="main",host="snow"}), "source", "fallback", "", "") or label_replace((time() - min(min_over_time(timestamp(urnetwork_sn_validator_intent_finalized_block{env="main",host="snow"} >= scalar(max(max_over_time(urnetwork_sn_validator_intent_finalized_block{env="main",host="snow"}[4h] @ end()))))[4h:1m]))) / 12, "source", "validator", "", ""))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [860], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "Neither the validator nor the weight fallback shows a commit of UID 1's SN25 weights in the last 860 blocks."
        isPaused: false

      # The replay scratch grows tens of GB a day until the cleanup fix ships.
      - uid: sn-validator-disk-low
        title: SnValidatorDiskLow
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'min(urnetwork_sn_validator_state_filesystem_available_bytes{env="main",host="snow"} / urnetwork_sn_validator_state_filesystem_size_bytes{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.2], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "Snow's validator state filesystem has under 20% free."
        isPaused: false

      - uid: sn-validator-disk-critical
        title: SnValidatorDiskCritical
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'min(urnetwork_sn_validator_state_filesystem_available_bytes{env="main",host="snow"} / urnetwork_sn_validator_state_filesystem_size_bytes{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "Snow's validator state filesystem has under 10% free."
        isPaused: false

      # It grows about 80 KB per native epoch against a 64 MiB bound.
      - uid: sn-validator-intents-file-large
        title: SnValidatorIntentsFileLarge
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_intents_file_bytes{env="main",host="snow"} / urnetwork_sn_validator_intents_file_limit_bytes{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "The SN25 validator's retained intent file is past half its bound; it needs a history checkpoint."
        isPaused: false

      - uid: sn-validator-intents-file-critical
        title: SnValidatorIntentsFileCritical
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_intents_file_bytes{env="main",host="snow"} / urnetwork_sn_validator_intents_file_limit_bytes{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.8], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: {service: sn-validator, severity: page}
        annotations:
          summary: "The SN25 validator's retained intent file is past 80% of its bound."
        isPaused: false

      # Four hours spans more than three native epochs.
      - uid: sn-validator-trails-not-completing
        title: SnValidatorTrailsNotCompleting
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max(urnetwork_sn_validator_trails_completed_recent{env="main",host="snow"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 4h
        labels: {service: sn-validator, severity: warn}
        annotations:
          summary: "The SN25 validator has completed no trail for four hours; its measurements carry no provider evidence."
        isPaused: false
